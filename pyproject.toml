[project]
name = "sahay"
version = "0.1.0"
description = "Sahay: voice-first AI hospital receptionist (CODE RED '26, Cassette Labs PS-01)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "anthropic>=2.12,<3",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
voice = [
    "livekit-agents>=1.0",
    "livekit-api>=1.0",
    "livekit-plugins-sarvam>=1.0",
    "livekit-plugins-silero>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
