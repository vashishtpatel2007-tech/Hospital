services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sahay-db
    environment:
      POSTGRES_USER: sahay
      POSTGRES_PASSWORD: sahay
      POSTGRES_DB: sahay
    ports:
      - "5433:5432"   # 5433 on the laptop so it never clashes with a local Postgres
    volumes:
      - sahay-pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahay -d sahay"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sahay-pg:
